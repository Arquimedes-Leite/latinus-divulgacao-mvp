name: Monitoramento
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:
jobs:
  checar-site:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se o site responde
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://arquimedes-leite.github.io/latinus-divulgacao-mvp/ > /dev/null
